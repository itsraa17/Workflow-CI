name: MLflow CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.10"
        auto-update-conda: true

    - name: Create MLflow environment
      run: |
        cd MLProject
        conda env create -f conda.yaml -n weather_env || conda env update -f conda.yaml -n weather_env

    - name: Run MLflow project
      run: |
        cd MLProject
        conda run -n weather_env mlflow run .
